# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Display: nothing to do here. The nice_view shield already forces
# CONFIG_ZMK_DISPLAY=y through its own nice_view.conf.

# Deep sleep. CONFIG_ZMK_SLEEP has no "default y" upstream, so it must be
# set explicitly or the halves never power down. Sleep after 30 min idle.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Uncomment the following line to increase the keyboard's wireless range
# (costs battery life, disable it if autonomy matters more than range)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# change board name
CONFIG_ZMK_KEYBOARD_NAME="TA Corne"

# Enable ZMK Studio for Realtime Keymap Updates
CONFIG_ZMK_STUDIO=y
# CONFIG_ZMK_STUDIO_LOCKING=n

# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10
